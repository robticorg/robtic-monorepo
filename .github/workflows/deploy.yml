name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Queue runs instead of cancelling them, so two pushes can't redeploy the stack at the same time.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/robticorg/robtic-ticket

jobs:
  ci:
    name: Typecheck & test
    runs-on: ubuntu-latest
    # The database tests use a throwaway MongoDB (robtic-ticket-test, dropped after).
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        # Not a real token: the config module needs one to load; nothing logs in to Discord in the tests.
        env:
          DISCORD_TOKEN: MTAwMDAwMDAwMDAwMDAwMDAw.ci.test
          MONGODB_URI: mongodb://127.0.0.1:27017/robtic-ticket-test

  # `:production` is what the robtic-bots Portainer stack runs (robtic-ticket and robtic-ticket-transcripts);
  # `:sha-<commit>` never moves, so a rollback is the Portainer variable TICKET_IMAGE_TAG=sha-<commit>.
  image:
    name: Build & push image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=robtic-ticket
          cache-to: type=gha,mode=max,scope=robtic-ticket

  redeploy:
    name: Redeploy robtic-bots
    needs: image
    # The runner on the server (192.168.1.137): Portainer's webhook is reachable on the LAN only.
    runs-on: [self-hosted, robtic-deploy]
    steps:
      - name: Call the Portainer stack webhook
        env:
          WEBHOOK: ${{ secrets.ROBTIC_BOTS_PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::ROBTIC_BOTS_PORTAINER_WEBHOOK_URL is not set — image pushed, nothing redeployed."
            exit 0
          fi
          # Portainer serves a self-signed certificate on :9443.
          curl --fail-with-body -sSk -X POST --max-time 300 "$WEBHOOK"
